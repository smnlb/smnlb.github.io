; This name appears in the header and on various pages.
WikiName = Mycorrhiza Wiki
; This icon is used in the breadcrumbs bar.
NaviTitleIcon = 🍄

[Hyphae]
; This hypha will be the main (index) page of your wiki, served on /.
HomeHypha = home
; This hypha is used as a prefix for user hyphae.
UserHypha = u
; You can also specify a hypha to populate your own custom header links from.
HeaderLinksHypha = 
; Redirection hyphae will be added to this category. Default: redirection.
RedirectionCategory = redirection

[Network]
ListenAddr = 127.0.0.1:1737
; Set your wiki's public URL here. It's used for OpenGraph generation and syndication feeds.
URL = 

[Authorization]
UseAuth = false
AllowRegistration = false
; This field controls the maximum amount of allowed registrations.
RegistrationLimit = 0
; Set if users have to authorize to see anything on the wiki.
Locked = false
; If true, WhiteList is used. Else it is not used.
UseWhiteList = false
; Usernames of people who can log in to your wiki separated by comma.
WhiteList = 

; You can specify additional scripts to load on different kinds of pages, delimited by a comma ',' sign.
[CustomScripts]
; These scripts are loaded from anywhere.
CommonScripts = 
; These scripts are only loaded on view pages.
ViewScripts = 
; These scripts are only loaded on the edit page.
EditScripts = 

; You can enable Telegram authorization. Follow these instructions: https://core.telegram.org/widgets/login#setting-up-a-bot
[Telegram]
; Token of your bot.
TelegramBotToken = 
; Username of your bot, sans @.
TelegramBotName = 
