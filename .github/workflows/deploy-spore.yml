name: Deploy Static Wiki to GitHub Pages

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wiki repository
        uses: actions/checkout@v4 # Возвращаем стабильную версию

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Mycorrhiza from source
        run: |
          # Клонируем и собираем Mycorrhiza (используем зеркало на Codeberg)
          git clone --depth 1 https://codeberg.org/bouncepaw/mycorrhiza.git /tmp/mycorrhiza-src
          cd /tmp/mycorrhiza-src
          go build -o /tmp/mycorrhiza/mycorrhiza
          cd $GITHUB_WORKSPACE

      - name: Start Mycorrhiza in background
        run: |
          # Запускаем сервер на порту 1737, указывая на корень репозитория как на вики
          /tmp/mycorrhiza/mycorrhiza -listen-addr 127.0.0.1:1737 . &
          # Ждем, пока сервер запустится (проверяем доступность порта)
          for i in {1..15}; do
            if curl --silent --fail http://127.0.0.1:1737 > /dev/null; then
              echo "Mycorrhiza is up!"
              break
            fi
            echo "Waiting for Mycorrhiza..."
            sleep 2
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Clone Spore and install dependencies
        run: |
          # Клонируем Spore с SourceHut. Добавляем --depth 1 для скорости.
          # Если SourceHut недоступен, шаг упадёт, но мы это увидим в логах.
          git clone --depth 1 https://git.sr.ht/~absolutely-vivid/spore /tmp/spore
          cd /tmp/spore
          uv sync

      - name: Generate static site with Spore
        run: |
          cd /tmp/spore
          uv run python -m spore \
            --wiki-root $GITHUB_WORKSPACE \
            --wiki-url http://127.0.0.1:1737 \
            --output-dir $GITHUB_WORKSPACE/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: $GITHUB_WORKSPACE/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
