name: Deploy Static Wiki to GitHub Pages

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wiki repository
        uses: actions/checkout@v5

      - name: Start Mycorrhiza in Docker
        run: |
          # Запускаем официальный Docker-образ Mycorrhiza в фоне
          docker run -d --name mycorrhiza -p 1737:1737 -v $GITHUB_WORKSPACE:/wiki bouncepaw/mycorrhiza
          # Ждем, пока сервер поднимется
          for i in {1..15}; do
            if curl --silent --fail http://127.0.0.1:1737 > /dev/null; then
              echo "Mycorrhiza is up!"
              break
            fi
            echo "Waiting for Mycorrhiza..."
            sleep 2
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Clone Spore and install dependencies
        run: |
          git clone https://git.sr.ht/~absolutely-vivid/spore /tmp/spore
          cd /tmp/spore
          uv sync

      - name: Generate static site with Spore
        run: |
          cd /tmp/spore
          uv run python -m spore \
            --wiki-root $GITHUB_WORKSPACE \
            --wiki-url http://127.0.0.1:1737 \
            --output-dir $GITHUB_WORKSPACE/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: $GITHUB_WORKSPACE/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
