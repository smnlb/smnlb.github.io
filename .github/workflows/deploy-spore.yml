name: Deploy Static Wiki to GitHub Pages

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wiki repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Build Mycorrhiza from source
        run: |
          git clone --depth 1 https://codeberg.org/bouncepaw/mycorrhiza.git /tmp/mycorrhiza-src
          cd /tmp/mycorrhiza-src
          go build -o /tmp/mycorrhiza/mycorrhiza
          cd $GITHUB_WORKSPACE

      - name: Start Mycorrhiza in background
        run: |
          /tmp/mycorrhiza/mycorrhiza -listen-addr 127.0.0.1:1737 . &
          for i in {1..15}; do
            if curl --silent --fail http://127.0.0.1:1737 > /dev/null; then
              echo "Mycorrhiza is up!"
              break
            fi
            echo "Waiting for Mycorrhiza..."
            sleep 2
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download and install Spore
        run: |
          # Скачиваем архив с исходным кодом Spore напрямую через wget
          wget -q https://git.sr.ht/~absolutely-vivid/spore/archive/main.tar.gz -O /tmp/spore.tar.gz
          mkdir -p /tmp/spore
          tar -xzf /tmp/spore.tar.gz -C /tmp/spore --strip-components=1
          cd /tmp/spore
          # Устанавливаем зависимости и сам Spore в виртуальное окружение
          uv venv
          source .venv/bin/activate
          uv pip install .

      - name: Generate static site with Spore
        run: |
          cd /tmp/spore
          source .venv/bin/activate
          python -m spore \
            --wiki-root $GITHUB_WORKSPACE \
            --wiki-url http://127.0.0.1:1737 \
            --output-dir $GITHUB_WORKSPACE/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: $GITHUB_WORKSPACE/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
